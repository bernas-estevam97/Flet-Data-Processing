[project]
name = "flet-app"
version = "1.0.0"
description = "A data processing tool for data obtained from the MotoRater machine."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Bernardo", email = "you@example.com" }
]
dependencies = [
    "flet>=1.0.4",
    "numpy>=2.2.6",
    "openpyxl>=3.1.5",
    "pandas>=2.3.3",
    "python-calamine>=0.6.2",
    "rustpy-xlsxwriter>=0.8.0",
    "xlsxwriter>=3.2.9",
]

[dependency-groups]
dev = [
    "flet-cli>=1.0.4",
    "flet-desktop>=1.0.4",
    "flet-web>=1.0.4",
]

[tool.flet]
org = "Bernardo Estevam"
product = "MotoRater_Data_Processing"

[tool.flet.app]
path = "src"

[tool.flet.windows]
icon = "assets/icon.ico"
